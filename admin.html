<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2447">
<title>Panel Pengurus — Koperasi Konsumen Mandiri</title>
<style>
:root{--bg:#fff;--surf:#f2f5fa;--ink:#0f1b33;--mute:#4b5a75;--brand:#0b2447;--navy:#0b2447;--navy2:#2a5aa8;--on:#fff;--line:#d9e0ec;--acc:#fbc31d;--ok:#1a7f43;--bad:#b3261e;--logo:url(logo.png);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#07142a;--surf:#0e2140;--ink:#e8edf7;--mute:#9fb0cc;--navy:#2f5fb3;--navy2:#6c9be6;--line:#22385c;--ok:#4fd38a;--bad:#ff8a7a}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--surf);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;min-height:60px}
.lg{width:40px;height:40px;border-radius:50%;background:#fff var(--logo) center/contain no-repeat;flex:none}
.bar{gap:8px}.bar b{flex:1;font-size:16px;line-height:1.2}.bar small{display:block;font-weight:400;opacity:.8;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;font:600 15px inherit;font-family:inherit;border:2px solid var(--navy);background:var(--navy);color:var(--on);cursor:pointer}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff;min-height:40px;padding:0 14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=password],input[type=search]{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#login{max-width:380px;margin:56px auto}
#login h1{font-size:22px;margin:0 0 16px}.f{margin-bottom:14px}
.msg{min-height:20px;font-size:14px;margin-top:10px;color:var(--bad)}
#app{display:none;padding:20px 0 48px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tab{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px inherit;font-family:inherit;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on)}
.tab span{opacity:.75;font-weight:500;margin-left:4px}
.search{flex:1;min-width:180px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;gap:10px}
.item h3{margin:0;font-size:17px}
.meta{display:grid;gap:4px 16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));font-size:14px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surf);border:1px solid var(--line);white-space:nowrap}
.badge.pending{border-color:var(--acc);color:var(--ink)}.badge.active{color:var(--ok);border-color:var(--ok)}.badge.rejected{color:var(--bad);border-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;padding:12px 18px;border-radius:10px;display:none;max-width:90%;z-index:20}
.btn.alt{background:transparent;color:var(--navy)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}.scroll{overflow-x:auto}
.btn.alt{background:transparent;color:var(--navy)}select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi small{color:var(--mute);display:block;font-size:13px}.kpi b{font-size:20px;display:block;margin-top:4px}.thumb{width:72px;height:56px;border-radius:8px;object-fit:cover;background:var(--surf);flex:none}.row{display:flex;gap:12px;align-items:flex-start}.orow{display:grid;gap:8px;grid-template-columns:1fr 1fr;padding:10px 0;border-bottom:1px solid var(--line)}@media(min-width:700px){.orow{grid-template-columns:1.4fr 1fr 1fr 1fr auto}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:20px;max-width:380px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(0,0,0,.55)}dialog h2{margin:0 0 14px;font-size:18px}
</style>
</head>
<body>
<header><div class="wrap bar"><span class="lg" role="img" aria-label="Logo koperasi"></span><b>Panel Pengurus<small>Koperasi Konsumen Mandiri</small></b><button class="btn ghost" id="pwb" aria-label="Ganti password" hidden>Password</button><button class="btn ghost" id="out" hidden>Keluar</button></div></header>

<main class="wrap">
 <form class="card" id="login" novalidate>
  <h1>Masuk pengurus</h1>
  <div class="f"><label for="u">Username</label><input id="u" type="text" autocomplete="username" autocapitalize="none" required></div>
  <div class="f"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
  <button class="btn" style="width:100%" type="submit">Masuk</button>
  <div class="msg" id="lm" role="alert"></div>
 </form>

 <section id="app" aria-label="Verifikasi anggota">
  <div class="tools" id="views" role="group" aria-label="Bagian"><button class="tab" type="button" data-v="dash" aria-pressed="true">Dashboard</button><button class="tab" type="button" data-v="members" aria-pressed="false">Anggota</button><button class="tab" type="button" data-v="loans" aria-pressed="false">Pinjaman</button><button class="tab" type="button" data-v="news" aria-pressed="false">Berita</button><button class="tab" type="button" data-v="reports" aria-pressed="false">Laporan</button><button class="tab" type="button" data-v="profile" aria-pressed="false">Profil</button></div>
  <div class="tools" id="tabs" role="group" aria-label="Filter status"></div>
  <div class="tools" id="stools"><input class="search" id="q" type="search" placeholder="Cari nama, NIK, atau nomor registrasi" aria-label="Cari pendaftar"><button class="btn" id="rf" type="button">Muat ulang</button></div>
  <div id="list" aria-live="polite"></div>
 </section>
</main>
<dialog id="pw" aria-labelledby="pwt"><form id="pwf" novalidate><h2 id="pwt">Ganti password</h2>
 <div class="f"><label for="pw-o">Password lama</label><input id="pw-o" type="password" autocomplete="current-password"></div>
 <div class="f"><label for="pw-n">Password baru (minimal 8 karakter)</label><input id="pw-n" type="password" autocomplete="new-password"></div>
 <div class="f"><label for="pw-c">Ulangi password baru</label><input id="pw-c" type="password" autocomplete="new-password"></div>
 <div class="acts" style="display:flex;gap:8px"><button class="btn" type="submit">Simpan</button><button class="btn alt" type="button" id="pwc">Batal</button></div>
 <div class="msg" id="pwm" role="status"></div></form></dialog>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script>
var API=window.KKM_API||'';
var $=function(i){return document.getElementById(i)};
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k)||'';if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return ''}}
var S={token:ss('kkm_t'),rows:[],tab:'pending',view:'dash',loans:[],inst:[],open:{}};
var TABS=[['pending','Menunggu'],['active','Aktif'],['rejected','Ditolak'],['all','Semua']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rp(n){return 'Rp '+Math.round(n).toLocaleString('id-ID')}
function dt(s){if(!s)return '-';var d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},3500)}
function call(body){
 if(!API)return Promise.reject(new Error('API belum diisi di file HTML.'));
 return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function show(login){$('login').style.display=login?'':'none';$('app').style.display=login?'none':'block';$('out').hidden=$('pwb').hidden=login}
function logout(msg){S.token='';ss('kkm_t',null);show(true);if(msg)$('lm').textContent=msg}
$('out').onclick=function(){logout()};
$('login').addEventListener('submit',function(e){
 e.preventDefault();var b=e.target.querySelector('button');$('lm').textContent='';
 if(!$('u').value.trim()||!$('p').value){$('lm').textContent='Isi username dan password.';return}
 b.disabled=true;
 call({action:'login',username:$('u').value,password:$('p').value}).then(function(j){
  if(j.ok){S.token=j.token;ss('kkm_t',j.token);$('p').value='';show(false);load()}
  else $('lm').textContent=j.error||'Gagal masuk.';
 }).catch(function(err){$('lm').textContent=err.message||'Koneksi gagal.'}).then(function(){b.disabled=false});
});
function loadM(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 call({action:'list',token:S.token}).then(function(j){
  if(j.expired){logout(j.error);return}
  if(!j.ok){$('list').innerHTML='<p class="empty">'+esc(j.error)+'</p>';return}
  S.rows=j.rows.reverse();render();
 }).catch(function(){$('list').innerHTML='<p class="empty">Koneksi gagal. Coba muat ulang.</p>'});
}
function count(k){return k==='all'?S.rows.length:S.rows.filter(function(r){return r.status===k}).length}
function renderM(){
 $('tabs').innerHTML=TABS.map(function(t){return '<button class="tab" type="button" data-t="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'<span>'+count(t[0])+'</span></button>'}).join('');
 var q=$('q').value.toLowerCase().trim();
 var rows=S.rows.filter(function(r){
  return (S.tab==='all'||r.status===S.tab)&&(!q||(r.full_name+' '+r.nik+' '+r.reg_no+' '+r.member_code).toLowerCase().indexOf(q)>-1)});
 if(!rows.length){$('list').innerHTML='<p class="empty">Tidak ada data.</p>';return}
 var L={pending:'Menunggu',active:'Aktif',rejected:'Ditolak',inactive:'Nonaktif'};
 $('list').innerHTML=rows.map(function(r){
  var a=r.status==='pending'?'<div class="acts"><button class="btn ok" data-a="approve" data-r="'+esc(r.reg_no)+'">Setujui</button><button class="btn bad" data-a="reject" data-r="'+esc(r.reg_no)+'">Tolak</button></div>':(r.status==='active'&&r.member_code?'<div class="acts"><button class="btn alt" data-l="acct" data-r="'+esc(r.member_code)+'">Buat / reset akun login</button></div>':'');
  return '<article class="item"><div class="top"><div><h3>'+esc(r.full_name)+'</h3><span style="font-size:13px;color:var(--mute)">'+esc(r.reg_no)+(r.member_code?' · '+esc(r.member_code):'')+'</span></div><span class="badge '+esc(r.status)+'">'+esc(L[r.status]||r.status)+'</span></div>'+
  '<div class="meta"><div>NIK<br><b>'+esc(r.nik)+'</b></div><div>HP / WhatsApp<br><b>'+esc(r.phone)+'</b></div><div>Simpanan pokok<br><b>'+rp(r.savings_principal)+'</b></div><div>Mendaftar<br><b>'+dt(r.created_at)+'</b></div>'+
  (r.joined_at?'<div>Bergabung<br><b>'+dt(r.joined_at)+'</b></div>':'')+(r.verified_by?'<div>Diverifikasi oleh<br><b>'+esc(r.verified_by)+'</b></div>':'')+'</div>'+
  '<div class="meta"><div style="grid-column:1/-1">Alamat<br><b>'+esc(r.address)+'</b></div></div>'+a+'</article>'}).join('');
}
$('tabs').onclick=function(e){var t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;render()}};
$('q').addEventListener('input',render);
$('rf').onclick=load;
$('list').onclick=function(e){
 var b=e.target.closest('[data-a]');if(!b)return;
 var reg=b.dataset.r,ap=b.dataset.a==='approve',r=S.rows.filter(function(x){return x.reg_no===reg})[0];
 if(!confirm((ap?'Setujui ':'Tolak ')+r.full_name+'?\n\nPastikan data dan setoran simpanan pokok sudah diperiksa.'))return;
 b.disabled=true;
 call({action:b.dataset.a,token:S.token,reg_no:reg}).then(function(j){
  if(j.expired){logout(j.error);return}
  if(!j.ok){toast(j.error||'Gagal.');b.disabled=false;return}
  toast(ap?'Disetujui. Nomor anggota '+j.member_code:'Pendaftar ditolak.');load();
 }).catch(function(){toast('Koneksi gagal.');b.disabled=false});
};

function render(){S.view==='loans'?renderL():renderM()}
function load(){var c=S.view==='members'||S.view==='loans';$('tabs').style.display=$('stools').style.display=c?'':'none';({members:loadM,loans:loadL,dash:loadD,news:loadN,reports:loadR,profile:loadP})[S.view]()}
$('views').onclick=function(e){var b=e.target.closest('[data-v]');if(!b)return;S.view=b.dataset.v;S.tab='pending';$('q').value='';[].forEach.call($('views').children,function(x){x.setAttribute('aria-pressed',x===b)});load()};
var LT=[['pending','Menunggu'],['approved','Berjalan'],['paid_off','Lunas'],['rejected','Ditolak'],['all','Semua']];
var LL={pending:'Menunggu',approved:'Berjalan',rejected:'Ditolak',paid_off:'Lunas'},IL={paid:'Lunas',overdue:'Jatuh tempo',unpaid:'Belum bayar'};
function loadL(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 call({action:'loans',token:S.token}).then(function(j){
  if(j.expired){logout(j.error);return}
  if(!j.ok){$('list').innerHTML='<p class="empty">'+esc(j.error)+'</p>';return}
  S.loans=j.loans.reverse();S.inst=j.installments;renderL();
 }).catch(function(){$('list').innerHTML='<p class="empty">Koneksi gagal. Coba muat ulang.</p>'});
}
function renderL(){
 var n=function(k){return k==='all'?S.loans.length:S.loans.filter(function(l){return l.status===k}).length};
 $('tabs').innerHTML=LT.map(function(t){return '<button class="tab" type="button" data-t="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'<span>'+n(t[0])+'</span></button>'}).join('');
 var q=$('q').value.toLowerCase().trim();
 var rows=S.loans.filter(function(l){return (S.tab==='all'||l.status===S.tab)&&(!q||(l.loan_code+' '+l.name+' '+l.member_code).toLowerCase().indexOf(q)>-1)});
 if(!rows.length){$('list').innerHTML='<p class="empty">Tidak ada data.</p>';return}
 $('list').innerHTML=rows.map(function(l){
  var I=S.inst.filter(function(i){return i.loan_code===l.loan_code}),o=S.open[l.loan_code],c=esc(l.loan_code);
  var left=I.reduce(function(a,i){return a+(i.status==='paid'?0:i.total_due-i.paid_amount)},0);
  var acts=l.status==='pending'?'<div class="acts"><button class="btn ok" data-l="lok" data-r="'+c+'">Setujui</button><button class="btn bad" data-l="lno" data-r="'+c+'">Tolak</button></div>':(I.length?'<div class="acts"><button class="btn alt" data-l="open" data-r="'+c+'">'+(o?'Tutup cicilan':'Lihat cicilan')+'</button></div>':'');
  var tbl=o?'<div class="scroll"><table><thead><tr><th>#</th><th>Jatuh tempo</th><th>Tagihan</th><th>Status</th><th></th></tr></thead><tbody>'+I.map(function(i){
   return '<tr><td>'+i.installment_no+'</td><td>'+dt(i.due_date)+'</td><td>'+rp(i.total_due)+'</td><td>'+IL[i.status]+'</td><td>'+(i.status!=='paid'&&l.status==='approved'?'<button class="btn ok" style="min-height:36px;padding:0 10px" data-l="pay" data-r="'+c+'" data-n="'+i.installment_no+'">Konfirmasi bayar</button>':'')+'</td></tr>'}).join('')+'</tbody></table></div>':'';
  return '<article class="item"><div class="top"><div><h3>'+esc(l.name)+'</h3><span style="font-size:13px;color:var(--mute)">'+c+' · '+esc(l.member_code)+'</span></div><span class="badge '+(l.status==='approved'?'active':l.status==='rejected'?'rejected':l.status==='pending'?'pending':'')+'">'+esc(LL[l.status]||l.status)+'</span></div>'+
  '<div class="meta"><div>Pokok pinjaman<br><b>'+rp(l.amount_requested)+'</b></div><div>Tenor<br><b>'+l.tenor_months+' bulan</b></div><div>Jasa<br><b>'+l.interest_rate_pct+'% / bulan</b></div><div>Diajukan<br><b>'+dt(l.submitted_at)+'</b></div>'+(I.length?'<div>Sisa tagihan<br><b>'+rp(left)+'</b></div>':'')+'</div>'+
  '<div class="meta"><div style="grid-column:1/-1">Tujuan<br><b>'+esc(l.purpose)+'</b></div></div>'+acts+tbl+'</article>'}).join('');
}
$('list').addEventListener('click',function(e){
 var b=e.target.closest('[data-l]');if(!b)return;var k=b.dataset.l,r=b.dataset.r;
 if(k==='open'){S.open[r]=!S.open[r];renderL();return}
 var M={acct:['make_account','Buat password login baru untuk '+r+'? Password lama (jika ada) tidak berlaku lagi.'],lok:['loan_approve','Setujui pinjaman '+r+'? Jadwal cicilan akan dibuat otomatis.'],lno:['loan_reject','Tolak pinjaman '+r+'?'],pay:['pay','Konfirmasi pembayaran cicilan ke-'+b.dataset.n+' untuk '+r+'?']}[k];
 if(!M||!confirm(M[1]))return;
 var body={action:M[0],token:S.token};
 if(k==='acct')body.member_code=r;else{body.loan_code=r;if(k==='pay')body.no=b.dataset.n}
 b.disabled=true;
 call(body).then(function(j){
  if(j.expired){logout(j.error);return}
  b.disabled=false;
  if(!j.ok){toast(j.error||'Gagal.');return}
  if(k==='acct'){prompt('Password awal untuk '+r+'. Salin lalu berikan ke anggota (hanya tampil sekali):',j.password);return}
  toast('Berhasil.');load();
 }).catch(function(){toast('Koneksi gagal.');b.disabled=false});
});

var UN={barang_kemasan:'Barang & Makanan Kemasan',makanan_jadi:'Makanan Jadi',konsolidasi:'Konsolidasi'};
function today(){return new Date().toISOString().slice(0,10)}
function img(id,w){return 'https://drive.google.com/thumbnail?id='+id+'&sz=w'+(w||400)}
function fld(id,l,v,t){return '<div class="f"><label for="'+id+'">'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v)+'"></div>'}
function area(id,l,v,r){return '<div class="f"><label for="'+id+'">'+l+'</label><textarea id="'+id+'" rows="'+(r||3)+'">'+esc(v)+'</textarea></div>'}
function sel(id,l,o,v){return '<div class="f"><label for="'+id+'">'+l+'</label><select id="'+id+'">'+o.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===v?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')+'</select></div>'}
function rd(f,max){return new Promise(function(ok,no){if(!f)return ok(null);if(f.size>max)return no(new Error('Ukuran berkas melebihi batas.'));var r=new FileReader();r.onload=function(){ok({name:f.name,mime:f.type,data:String(r.result).split(',')[1]})};r.onerror=function(){no(new Error('Gagal membaca berkas.'))};r.readAsDataURL(f)})}
function fail(){$('list').innerHTML='<p class="empty">Koneksi gagal. Coba muat ulang.</p>'}
function guard(j){if(j.expired){logout(j.error);return false}if(!j.ok){$('list').innerHTML='<p class="empty">'+esc(j.error)+'</p>';return false}return true}
function download(code,b){
 if(b)b.disabled=true;
 call({action:'report_download',token:S.token,report_code:code}).then(function(j){
  if(b)b.disabled=false;if(j.expired){logout(j.error);return}if(!j.ok){toast(j.error||'Gagal.');return}
  var s=atob(j.data),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=j.name;document.body.appendChild(a);a.click();a.remove();
 }).catch(function(){if(b)b.disabled=false;toast('Koneksi gagal.')});
}
/* ---- Dashboard ---- */
function loadD(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 call({action:'dash',token:S.token}).then(function(j){
  if(!guard(j))return;
  var K=[['Anggota aktif',j.active],['Antrean pendaftar',j.pending],['Omzet bulan terakhir',rp(j.omzet)+(j.omzet_period?'<small>'+esc(j.omzet_period)+'</small>':'')],['Pokok pinjaman berjalan',rp(j.loan_running)],['Pengajuan pinjaman menunggu',j.loan_pending]];
  $('list').innerHTML='<div class="kpis">'+K.map(function(k){return '<div class="kpi"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>'}).join('')+'</div><div class="card"><h3 style="margin:0 0 8px">Aktivitas terbaru</h3>'+(j.logs.length?j.logs.map(function(l){return '<div style="padding:8px 0;border-top:1px solid var(--line);font-size:14px"><b>'+esc(l.user)+'</b> · '+esc(l.desc)+'<br><span style="color:var(--mute);font-size:12px">'+dt(l.at)+'</span></div>'}).join(''):'<p class="empty">Belum ada aktivitas.</p>')+'</div>';
 }).catch(fail);
}
/* ---- Berita ---- */
function loadN(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 call({action:'news_list',token:S.token}).then(function(j){if(!guard(j))return;S.news=j.news;S.nedit=null;renderN()}).catch(fail);
}
function newsForm(p){
 return '<form class="card" id="nf" novalidate style="margin-bottom:16px"><h3 style="margin:0 0 12px">'+(p.id?'Edit berita':'Tulis berita baru')+'</h3><input type="hidden" id="nf-id" value="'+esc(p.id||'')+'">'+
 fld('nf-t','Judul',p.title)+sel('nf-c','Kategori',[['Kegiatan Usaha','Kegiatan Usaha'],['Keanggotaan','Keanggotaan'],['Rapat Anggota','Rapat Anggota']],p.category)+
 fld('nf-d','Tanggal terbit',(p.published_at||today()).slice(0,10),'date')+area('nf-e','Cuplikan singkat',p.excerpt,2)+area('nf-k','Isi berita (pisahkan paragraf dengan baris kosong)',p.content,8)+
 '<div class="f"><label for="nf-i">Foto kegiatan (JPG/PNG/WebP, maks. 2 MB)'+(p.image_id?' — kosongkan untuk tetap pakai foto lama':'')+'</label><input id="nf-i" type="file" accept="image/jpeg,image/png,image/webp"></div>'+
 '<div class="acts"><button class="btn" type="submit">Simpan</button><button class="btn alt" type="button" data-n="cancel">Batal</button></div><div class="msg" id="nf-m" role="status"></div></form>';
}
function renderN(){
 var f=S.nedit?newsForm(S.nedit):'<p style="margin:0 0 16px"><button class="btn" data-n="new">+ Tulis berita baru</button></p>';
 $('list').innerHTML=f+(S.news.length?S.news.map(function(n){return '<article class="item"><div class="row">'+(n.image_id?'<img class="thumb" alt="" src="'+img(n.image_id,200)+'">':'<div class="thumb"></div>')+'<div style="flex:1"><h3>'+esc(n.title)+'</h3><span style="font-size:13px;color:var(--mute)">'+esc(n.category)+' · '+dt(n.published_at)+'</span></div></div><div class="acts"><button class="btn alt" data-n="edit" data-r="'+esc(n.id)+'">Edit</button><button class="btn bad" data-n="del" data-r="'+esc(n.id)+'">Hapus</button></div></article>'}).join(''):'<p class="empty">Belum ada berita.</p>');
}
/* ---- Laporan ---- */
function loadR(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 call({action:'reports',token:S.token}).then(function(j){if(!guard(j))return;S.reps=j.reports;renderR()}).catch(fail);
}
function renderR(){
 var f='<form class="card" id="rf2" novalidate style="margin-bottom:16px"><h3 style="margin:0 0 12px">Unggah laporan usaha</h3>'+fld('rp-t','Judul laporan','')+fld('rp-p','Periode (contoh: November 2026)','')+
 sel('rp-u','Unit usaha',[['konsolidasi','Konsolidasi'],['barang_kemasan','Barang & Makanan Kemasan'],['makanan_jadi','Makanan Jadi']],'konsolidasi')+
 fld('rp-a','Omzet barang & makanan kemasan (Rp)','','text')+fld('rp-b','Omzet makanan jadi (Rp)','','text')+area('rp-s','Ringkasan omzet & surplus','',2)+fld('rp-d','Tanggal publikasi',today(),'date')+
 '<div class="f"><label for="rp-f">Berkas PDF (maks. 10 MB)</label><input id="rp-f" type="file" accept="application/pdf"></div><button class="btn" type="submit">Unggah</button><div class="msg" id="rp-m" role="status"></div></form>';
 $('list').innerHTML=f+(S.reps.length?S.reps.map(function(r){return '<article class="item"><div class="top"><div><h3>'+esc(r.title)+'</h3><span style="font-size:13px;color:var(--mute)">'+esc(r.period_label)+' · '+esc(UN[r.business_unit]||r.business_unit)+' · '+dt(r.published_at)+' · '+r.file_size_kb+' KB</span></div></div><div class="meta"><div>Omzet kemasan<br><b>'+rp(r.packaged_goods_sales)+'</b></div><div>Omzet makanan jadi<br><b>'+rp(r.ready_meals_sales)+'</b></div></div>'+(r.summary?'<div style="font-size:14px;color:var(--mute)">'+esc(r.summary)+'</div>':'')+'<div class="acts"><button class="btn alt" data-p="dl" data-r="'+esc(r.report_code)+'">Unduh PDF</button><button class="btn bad" data-p="del" data-r="'+esc(r.report_code)+'">Hapus</button></div></article>'}).join(''):'<p class="empty">Belum ada laporan.</p>');
}
/* ---- Profil ---- */
function orow(o){o=o||{};return '<div class="orow"><input type="text" placeholder="Nama lengkap" value="'+esc(o.full_name)+'" aria-label="Nama"><input type="text" placeholder="Jabatan" value="'+esc(o.position)+'" aria-label="Jabatan"><select aria-label="Kelompok"><option value="pengurus"'+(o.group_type==='pengawas'?'':' selected')+'>Pengurus</option><option value="pengawas"'+(o.group_type==='pengawas'?' selected':'')+'>Pengawas</option></select><input type="text" placeholder="Periode (2026–2029)" value="'+esc(o.period_label)+'" aria-label="Periode"><button class="btn bad" type="button" data-o="rm" style="min-height:44px;padding:0 12px">Hapus</button></div>'}
function loadP(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 fetch(API+'?action=public').then(function(r){return r.json()}).then(function(j){
  if(!j.ok){$('list').innerHTML='<p class="empty">Gagal memuat.</p>';return}
  var p=j.profile||{};
  $('list').innerHTML='<form class="card" id="pf" novalidate><h3 style="margin:0 0 12px">Profil koperasi</h3>'+fld('pf-n','Nama resmi',p.name)+fld('pf-l','Nomor badan hukum',p.legal_number)+area('pf-a','Alamat sekretariat / toko',p.address,2)+fld('pf-h','Jam operasional',p.hours)+fld('pf-c','Kontak (telepon/WhatsApp/email)',p.contact)+area('pf-v','Visi',p.vision,2)+area('pf-m','Misi (satu poin per baris)',p.mission,5)+
  '<h3 style="margin:18px 0 6px">Pengurus & pengawas</h3><div id="orgs">'+(j.org||[]).map(orow).join('')+'</div><p><button class="btn alt" type="button" data-o="add">+ Tambah baris</button></p><button class="btn" type="submit">Simpan profil</button><div class="msg" id="pf-m" role="status"></div></form>';
 }).catch(fail);
}
/* ---- Aksi berita, laporan, profil ---- */
function say(id,t,ok){var m=$(id);m.style.color=ok?'var(--ok)':'var(--bad)';m.textContent=t}
$('list').addEventListener('click',function(e){
 var b=e.target.closest('[data-n],[data-p],[data-o]');if(!b)return;
 if(b.dataset.o==='add'){$('orgs').insertAdjacentHTML('beforeend',orow());return}
 if(b.dataset.o==='rm'){b.closest('.orow').remove();return}
 var k=b.dataset.n,r=b.dataset.r;
 if(k==='new'){S.nedit={};renderN();return}
 if(k==='cancel'){S.nedit=null;renderN();return}
 if(k==='edit'){S.nedit=S.news.filter(function(n){return String(n.id)===r})[0];renderN();window.scrollTo(0,0);return}
 if(k==='del'||b.dataset.p==='del'){
  if(!confirm('Hapus permanen? Tindakan ini tidak bisa dibatalkan.'))return;
  var body=k==='del'?{action:'news_delete',token:S.token,id:r}:{action:'report_delete',token:S.token,report_code:r};
  b.disabled=true;call(body).then(function(j){if(j.expired){logout(j.error);return}b.disabled=false;if(!j.ok){toast(j.error||'Gagal.');return}toast('Terhapus.');load()}).catch(function(){b.disabled=false;toast('Koneksi gagal.')});return}
 if(b.dataset.p==='dl')download(r,b);
});
$('list').addEventListener('submit',function(e){
 e.preventDefault();var f=e.target,btn=f.querySelector('button[type=submit]');
 if(f.id==='nf'){
  if(!$('nf-t').value.trim()||!$('nf-e').value.trim()||!$('nf-k').value.trim()){say('nf-m','Judul, cuplikan, dan isi wajib diisi.');return}
  btn.disabled=true;say('nf-m','Menyimpan…',1);
  rd($('nf-i').files[0],2*1024*1024).then(function(im){return call({action:'news_save',token:S.token,id:$('nf-id').value,title:$('nf-t').value,category:$('nf-c').value,published_at:$('nf-d').value,excerpt:$('nf-e').value,content:$('nf-k').value,image:im})}).then(function(j){
   if(j.expired){logout(j.error);return}if(!j.ok){say('nf-m',j.error||'Gagal.');btn.disabled=false;return}toast('Berita tersimpan.');load()}).catch(function(x){say('nf-m',x.message||'Koneksi gagal.');btn.disabled=false});
 }
 if(f.id==='rf2'){
  if(!$('rp-t').value.trim()||!$('rp-p').value.trim()||!$('rp-f').files[0]){say('rp-m','Judul, periode, dan berkas PDF wajib diisi.');return}
  btn.disabled=true;say('rp-m','Mengunggah… (bisa beberapa detik)',1);
  rd($('rp-f').files[0],10*1024*1024).then(function(fl){return call({action:'report_save',token:S.token,title:$('rp-t').value,period_label:$('rp-p').value,business_unit:$('rp-u').value,packaged_goods_sales:$('rp-a').value,ready_meals_sales:$('rp-b').value,summary:$('rp-s').value,published_at:$('rp-d').value,file:fl})}).then(function(j){
   if(j.expired){logout(j.error);return}if(!j.ok){say('rp-m',j.error||'Gagal.');btn.disabled=false;return}toast('Laporan terunggah.');load()}).catch(function(x){say('rp-m',x.message||'Koneksi gagal.');btn.disabled=false});
 }
 if(f.id==='pf'){
  var org=[].map.call(document.querySelectorAll('.orow'),function(r){var i=r.querySelectorAll('input,select');return{full_name:i[0].value,position:i[1].value,group_type:i[2].value,period_label:i[3].value}});
  btn.disabled=true;say('pf-m','Menyimpan…',1);
  call({action:'profile_save',token:S.token,profile:{name:$('pf-n').value,legal_number:$('pf-l').value,address:$('pf-a').value,hours:$('pf-h').value,contact:$('pf-c').value,vision:$('pf-v').value,mission:$('pf-m').value},org:org}).then(function(j){
   if(j.expired){logout(j.error);return}btn.disabled=false;say('pf-m',j.ok?'Profil tersimpan.':(j.error||'Gagal.'),j.ok)}).catch(function(){btn.disabled=false;say('pf-m','Koneksi gagal.')});
 }
});

$('pwb').onclick=function(){$('pwf').reset();$('pwm').textContent='';$('pw').showModal()};
$('pwc').onclick=function(){$('pw').close()};
$('pwf').addEventListener('submit',function(e){
 e.preventDefault();var o=$('pw-o').value,n=$('pw-n').value,c=$('pw-c').value,m=$('pwm');m.style.color='var(--bad)';
 if(!o||!n){m.textContent='Isi semua kolom.';return}
 if(n.length<8){m.textContent='Password baru minimal 8 karakter.';return}
 if(n!==c){m.textContent='Konfirmasi password tidak sama.';return}
 var b=e.target.querySelector('button[type=submit]');b.disabled=true;
 call({action:'change_password',token:S.token,old_password:o,new_password:n}).then(function(j){
  b.disabled=false;if(j.expired){$('pw').close();logout(j.error);return}
  if(j.ok){m.style.color='var(--ok)';m.textContent='Password berhasil diganti.';e.target.reset();setTimeout(function(){$('pw').close()},1200)}else m.textContent=j.error||'Gagal.';
 }).catch(function(){b.disabled=false;m.textContent='Koneksi gagal.'});
});
if(S.token){show(false);load()}else show(true);
</script>
</body>
</html>
