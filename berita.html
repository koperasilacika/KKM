<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2447">
<link rel="icon" type="image/png" href="logo.png">
<title>Berita Kegiatan — Koperasi Konsumen Mandiri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surf:#f4f7fc;--ink:#0f1b33;--mute:#4b5a75;--brand:#0b2447;--navy2:#2557a7;--line:#dfe6f2;--acc:#fbc31d;--sh:0 6px 24px rgba(11,36,71,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#07142a;--surf:#0d1f3d;--ink:#eef3fb;--mute:#9bb0cf;--navy2:#6ea0f0;--line:#1e3559;--sh:0 8px 28px rgba(0,0,0,.35)}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 4px 18px rgba(11,36,71,.18)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px}
.bar a{color:#fff;text-decoration:none;font-weight:700;display:flex;align-items:center;gap:11px;flex:1;letter-spacing:-.01em}
.lg{width:42px;height:42px;border-radius:50%;background:#fff url(logo.png) center/contain no-repeat;flex:none}
.back{font-weight:600;font-size:14px;color:var(--acc)!important;flex:none!important;padding:8px 12px;border-radius:8px;border:1px solid rgba(251,195,29,.4)}
main{padding:36px 0 64px}
h1{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.18;margin:8px 0 12px;letter-spacing:-.02em}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--navy2);text-transform:uppercase;letter-spacing:.06em;background:var(--surf);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.meta{color:var(--mute);font-size:14px}
.hero{width:100%;max-height:440px;object-fit:cover;border-radius:16px;margin:18px 0;background:var(--surf);box-shadow:var(--sh)}
.body{font-size:16.5px;line-height:1.75}.body p{margin:0 0 1.15em}
.list{display:grid;gap:18px;margin-top:24px}
.post{display:grid;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);transition:transform .15s}
.post:hover{transform:translateY(-2px)}
.post img,.post .ph{width:100%;height:170px;object-fit:cover;background:var(--surf);display:block}
.post .b{padding:0 18px 18px}.post h2{margin:8px 0 6px;font-size:19px;font-weight:700;line-height:1.3}.post a{color:inherit;text-decoration:none}.post a:hover{color:var(--navy2)}.post p{margin:6px 0 0;color:var(--mute);font-size:14.5px;line-height:1.55}
@media(min-width:700px){.post{grid-template-columns:250px 1fr}.post img,.post .ph{height:100%;min-height:165px}.post .b{padding:18px 18px 18px 0}}
.empty{color:var(--mute);text-align:center;padding:44px 0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body class="pub">
<header><div class="wrap bar"><a href="index.html"><span class="lg" role="img" aria-label="Logo koperasi"></span>Koperasi Konsumen Mandiri</a><a class="back" href="index.html">&larr; Dashboard Utama</a></div></header>
<main class="wrap" id="m"><p class="empty">Memuat…</p></main>
<script src="config.js"></script>
<script>
var API=window.KKM_API||'',$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dt(s){var d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
function img(id,w){return 'https://drive.google.com/thumbnail?id='+id+'&sz=w'+w}
var slug=new URLSearchParams(location.search).get('slug');
if(!API){$('m').innerHTML='<p class="empty">Berita akan tampil setelah sistem terhubung.</p>'}
else if(slug){
 fetch(API+'?action=news&slug='+encodeURIComponent(slug)).then(function(r){return r.json()}).then(function(j){
  if(!j.ok){$('m').innerHTML='<p class="empty">'+esc(j.error||'Berita tidak ditemukan.')+'</p><p style="text-align:center"><a href="berita.html">Lihat semua berita</a></p>';return}
  var n=j.news;document.title=n.title+' — Koperasi Konsumen Mandiri';
  $('m').innerHTML='<span class="tag">'+esc(n.category)+'</span><h1>'+esc(n.title)+'</h1><div class="meta">'+dt(n.published_at)+'</div>'+(n.image_id?'<img class="hero" alt="Foto kegiatan: '+esc(n.title)+'" src="'+img(n.image_id,1200)+'">':'')+'<div class="body">'+String(n.content).split(/\n\s*\n/).map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'}).join('')+'</div><p style="display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-weight:600"><a href="berita.html">&larr; Kembali ke daftar berita</a><a href="index.html">&larr; Dashboard Utama</a></p>';
 }).catch(function(){$('m').innerHTML='<p class="empty">Koneksi gagal. Coba muat ulang.</p>'});
}else{
 fetch(API+'?action=public').then(function(r){return r.json()}).then(function(j){
  $('m').innerHTML='<h1>Berita kegiatan</h1><div class="meta">Kegiatan usaha, keanggotaan, rapat anggota, dan kegiatan sosial.</div><div class="list">'+(j.news.length?j.news.map(function(n){return '<article class="post">'+(n.image_id?'<img loading="lazy" alt="" src="'+img(n.image_id,500)+'">':'<div class="ph"></div>')+'<div class="b"><span class="tag">'+esc(n.category)+'</span><h2><a href="berita.html?slug='+encodeURIComponent(n.slug)+'">'+esc(n.title)+'</a></h2><div class="meta">'+dt(n.published_at)+'</div><p>'+esc(n.excerpt)+'</p></div></article>'}).join(''):'<p class="empty">Belum ada berita.</p>')+'</div>';
 }).catch(function(){$('m').innerHTML='<p class="empty">Koneksi gagal. Coba muat ulang.</p>'});
}
</script>
</body>
</html>
