@media (prefers-color-scheme:dark){:root{--bg:#07142a;--surf:#0e2140;--ink:#e8edf7;--mute:#9fb0cc;--navy:#2f5fb3;--navy2:#6c9be6;--line:#22385c;--ok:#4fd38a;--bad:#ff8a7a}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--surf);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;min-height:60px}
.lg{width:40px;height:40px;border-radius:50%;background:#fff var(--logo) center/contain no-repeat;flex:none}
.bar b{flex:1;font-size:16px;line-height:1.2}.bar small{display:block;font-weight:400;opacity:.8;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;font:600 15px inherit;font-family:inherit;border:2px solid var(--navy);background:var(--navy);color:var(--on);cursor:pointer}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff;min-height:40px;padding:0 14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=password],input[type=search]{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#login{max-width:380px;margin:56px auto}
#login h1{font-size:22px;margin:0 0 16px}.f{margin-bottom:14px}
.msg{min-height:20px;font-size:14px;margin-top:10px;color:var(--bad)}
#app{display:none;padding:20px 0 48px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tab{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px inherit;font-family:inherit;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--on)}
.tab span{opacity:.75;font-weight:500;margin-left:4px}
.search{flex:1;min-width:180px}
.item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;gap:10px}
.item h3{margin:0;font-size:17px}
.meta{display:grid;gap:4px 16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));font-size:14px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surf);border:1px solid var(--line);white-space:nowrap}
.badge.pending{border-color:var(--acc);color:var(--ink)}.badge.active{color:var(--ok);border-color:var(--ok)}.badge.rejected{color:var(--bad);border-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;padding:12px 18px;border-radius:10px;display:none;max-width:90%;z-index:20}
.btn.alt{background:transparent;color:var(--navy)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}.scroll{overflow-x:auto}

select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.res{background:var(--surf);border-radius:10px;padding:14px;margin-bottom:14px}.res b{font-size:22px}
.grid{display:grid;gap:16px}@media(min-width:800px){.grid{grid-template-columns:1fr 1.4fr;align-items:start}}
details summary{cursor:pointer;font-weight:600;padding:6px 0;min-height:32px}
h2{font-size:18px;margin:0 0 12px}
</style>
</head>
<body>
<header><div class="wrap bar"><span class="lg" role="img" aria-label="Logo koperasi"></span><b>Portal Anggota<small>Koperasi Konsumen Mandiri</small></b><button class="btn ghost" id="out" hidden>Keluar</button></div></header>
<main class="wrap">
 <form class="card" id="login" novalidate>
  <h1>Masuk anggota</h1>
  <div class="f"><label for="c">Nomor anggota</label><input id="c" type="text" placeholder="contoh: KKM001" autocapitalize="characters" autocomplete="username" required></div>
  <div class="f"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
  <button class="btn" style="width:100%" type="submit">Masuk</button>
  <div class="msg" id="lm" role="alert"></div>
  <p style="font-size:13px;color:var(--mute);margin:12px 0 0">Belum punya akun login? Minta ke pengurus setelah pendaftaran Anda disetujui.</p>
 </form>
 <section id="app" aria-label="Pinjaman saya">
  <p style="margin:0 0 16px">Halo, <b id="nm"></b></p>
  <div class="grid">
   <form class="card" id="ap" novalidate>
    <h2>Ajukan pinjaman</h2>
    <div class="f"><label for="a">Nominal pinjaman (Rp)</label><input id="a" type="text" inputmode="numeric" placeholder="contoh: 5000000"></div>
    <div class="f"><label for="t">Tenor</label><select id="t"><option>3</option><option>6</option><option selected>12</option><option>24</option></select></div>
    <div class="f"><label for="pu">Tujuan pinjaman</label><textarea id="pu" rows="2" maxlength="255"></textarea></div>
    <div class="res" aria-live="polite">Estimasi cicilan per bulan<br><b id="sim">—</b><br><small id="st" style="color:var(--mute)"></small></div>
    <button class="btn" style="width:100%" type="submit">Kirim pengajuan</button>
    <div class="msg" id="am" role="status"></div>
   </form>
   <div><h2>Pinjaman saya</h2><div id="list" aria-live="polite"></div></div>
  </div>
 </section>
</main>

var RATE=1;/* harus sama dengan RATE di Code.gs */
var $=function(i){return document.getElementById(i)};
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k)||'';if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return ''}}
var S={token:ss('kkm_m')};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rp(n){return 'Rp '+Math.round(n).toLocaleString('id-ID')}
function dt(s){if(!s)return '-';var d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function call(b){if(!API)return Promise.reject(new Error('API belum diisi di file HTML.'));return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function show(l){$('login').style.display=l?'':'none';$('app').style.display=l?'none':'block';$('out').hidden=l}
function logout(m){S.token='';ss('kkm_m',null);show(true);if(m)$('lm').textContent=m}
$('out').onclick=function(){logout()};
$('login').addEventListener('submit',function(e){
 e.preventDefault();var b=e.target.querySelector('button');$('lm').textContent='';
 if(!$('c').value.trim()||!$('p').value){$('lm').textContent='Isi nomor anggota dan password.';return}
 b.disabled=true;
 call({action:'mlogin',code:$('c').value,password:$('p').value}).then(function(j){
  if(j.ok){S.token=j.token;ss('kkm_m',j.token);$('p').value='';show(false);load()}else $('lm').textContent=j.error||'Gagal masuk.';
 }).catch(function(x){$('lm').textContent=x.message||'Koneksi gagal.'}).then(function(){b.disabled=false});
});
var LL={pending:'Menunggu persetujuan',approved:'Berjalan',rejected:'Ditolak',paid_off:'Lunas'},IL={paid:'Lunas',overdue:'Jatuh tempo',unpaid:'Belum bayar'};
function load(){
 $('list').innerHTML='<p class="empty">Memuat…</p>';
 call({action:'mloans',token:S.token}).then(function(j){
  if(j.expired){logout(j.error);return}
  if(!j.ok){$('list').innerHTML='<p class="empty">'+esc(j.error)+'</p>';return}
  $('nm').textContent=j.name;
  var L=j.loans.slice().reverse();
  if(!L.length){$('list').innerHTML='<p class="empty">Belum ada pinjaman.</p>';return}
  $('list').innerHTML=L.map(function(l){
   var I=j.installments.filter(function(i){return i.loan_code===l.loan_code}),left=I.reduce(function(a,i){return a+(i.status==='paid'?0:i.total_due-i.paid_amount)},0);
   var nx=I.filter(function(i){return i.status!=='paid'})[0];
   return '<article class="item" style="margin-bottom:12px"><div class="top"><div><h3>'+rp(l.amount_requested)+' · '+l.tenor_months+' bulan</h3><span style="font-size:13px;color:var(--mute)">'+esc(l.loan_code)+'</span></div><span class="badge '+(l.status==='approved'?'active':l.status==='rejected'?'rejected':l.status==='pending'?'pending':'')+'">'+esc(LL[l.status]||l.status)+'</span></div>'+
   '<div class="meta"><div>Tujuan<br><b>'+esc(l.purpose)+'</b></div><div>Diajukan<br><b>'+dt(l.submitted_at)+'</b></div>'+(I.length?'<div>Sisa tagihan<br><b>'+rp(left)+'</b></div>':'')+(nx&&l.status==='approved'?'<div>Cicilan terdekat<br><b>'+rp(nx.total_due)+' · '+dt(nx.due_date)+'</b></div>':'')+'</div>'+
   (I.length?'<details><summary>Jadwal cicilan</summary><div class="scroll"><table><thead><tr><th>#</th><th>Jatuh tempo</th><th>Tagihan</th><th>Status</th></tr></thead><tbody>'+I.map(function(i){return '<tr><td>'+i.installment_no+'</td><td>'+dt(i.due_date)+'</td><td>'+rp(i.total_due)+'</td><td>'+IL[i.status]+'</td></tr>'}).join('')+'</tbody></table></div></details>':'')+'</article>'}).join('');
 }).catch(function(){$('list').innerHTML='<p class="empty">Koneksi gagal. Muat ulang halaman.</p>'});
}
function sim(){
 var P=parseInt(($('a').value||'').replace(/\D/g,''),10)||0,n=parseInt($('t').value,10);
 if(!P){$('sim').textContent='—';$('st').textContent='';return}
 var jasa=Math.round(P*RATE/100*n),tot=P+jasa;
 $('sim').textContent=rp(Math.floor(tot/n));$('st').textContent='Total bayar '+rp(tot)+' selama '+n+' bulan (jasa '+RATE+'% per bulan)';
}
$('a').addEventListener('input',sim);$('t').addEventListener('input',sim);
$('ap').addEventListener('submit',function(e){
 e.preventDefault();var b=e.target.querySelector('button'),m=$('am');m.style.color='';
 var amt=($('a').value||'').replace(/\D/g,'');
 if(!amt||!$('pu').value.trim()){m.style.color='var(--bad)';m.textContent='Isi nominal dan tujuan pinjaman.';return}
 b.disabled=true;m.textContent='Mengirim…';
 call({action:'mapply',token:S.token,amount:amt,tenor:$('t').value,purpose:$('pu').value}).then(function(j){
  if(j.expired){logout(j.error);return}
  if(j.ok){e.target.reset();sim();m.style.color='var(--ok)';m.textContent='Pengajuan terkirim ('+j.loan_code+'). Menunggu persetujuan pengurus.';load()}
  else{m.style.color='var(--bad)';m.textContent=j.error||'Gagal.'}
 }).catch(function(){m.style.color='var(--bad)';m.textContent='Koneksi gagal.'}).then(function(){b.disabled=false});
});
if(S.token){show(false);load()}else show(true);
</script>
</body>
</html>
